# Utsava — local Supabase configuration.
# Plan §9: local `supabase start` + seed; per-PR preview branch; separate staging/production.

project_id = "utsava"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

# Plan §12: "Supavisor transaction pooling everywhere; no long-lived connections in functions."
[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.seed]
enabled = true
sql_paths = ["./seed/00_geo.sql", "./seed/01_catalog.sql", "./seed/02_plans.sql", "./seed/03_demo.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

# Plan §12: "Supabase CDN transforms bypass the image optimizer" — keeps Vercel media cost flat at SEO scale.
[storage.image_transformation]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Plan §2: enquiry flow is OTP-gated. Phone is the primary customer identity in India.
[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Your Utsava verification code is {{ .Code }}"

[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
auth_token = "env(TWILIO_AUTH_TOKEN)"

# Plan §3: Corporate (Phase 2) uses Google OAuth with domain capture.
[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_SECRET)"

# Plan §3: "capabilities come from memberships, not a role column" — the hook mirrors
# memberships into JWT claims so the UI can render the context switcher without a round trip.
# The database still re-derives every capability from the membership tables (see app.* helpers).
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/app/custom_access_token_hook"

[analytics]
enabled = false
